[Service]
# ============================================================================
# niri + xwayland-satellite 下的 clipferry 调参
#
# 覆盖 AUR 包 /usr/lib/systemd/user/clipferry.service 的默认 ExecStart。
# 修改后执行： systemctl --user daemon-reload && systemctl --user restart clipferry
# ============================================================================

# --eager-max-size 256M
#   clipferry 在 Wayland→X11 方向"claim 之前必须先抓取载荷"（上游 DESIGN.md §4.2）。
#   W→X 的 claim 会让 xwayland-satellite 把我们的 claim 镜像回 Wayland，
#   从而取消我们正在代理的 source；所以必须先握手再声明所有权。
#   超过该上限的**类型会被直接丢弃**（不是降级为 lazy）。
#   默认 10M 会让大截图/大图的 image/png 在 Wayland→X11 时凭空消失。
#   256M ≈ 剪贴板场景无限制，同时避免异常巨物整块进内存。
#   设为 0 = 完全不限制（内存占用是一次性快照）。
#
# --primary
#   一并桥接 PRIMARY（中键）选区。
#   实测 niri + xwayland-satellite 0.8.3 下 PRIMARY 两个方向都不通：
#     Wayland 选中 → X11 PRIMARY 读出空
#     X11 PRIMARY  → Wayland 读到上一次的旧值
#   clipferry 内部对 PRIMARY 做了 debounce，实测 RSS 平稳。
ExecStart=
ExecStart=/usr/bin/clipferry --eager-max-size 256M --primary

# 可选（默认不开，想改就取消注释并删掉上面的 ExecStart）：
#
#   --sync-mode eager
#     每次复制立刻快照，内容在**源程序退出后仍可粘贴**。
#     代价：每次复制都要搬运一次载荷。默认 lazy 只在真正粘贴时搬运。
#
#   --aggressive-claims
#     不要 200ms 的"让位窗口"，立即 claim。
#     ⚠️ 会重新变成和 xwayland-satellite 抢 X11 CLIPBOARD owner，
#     正是这套方案要消除的问题。除非确认卫星桥彻底不可用，否则别开。
#
#   --transfer-timeout 5
#     给停滞的传输加空闲超时。首字节始终有 2s 硬上限，一般不需要。
#
#   --skip-sensitive
#     不桥接密码管理器标记为 sensitive 的 offer。默认是会桥接但抑制日志类型。
#
#   --log-level debug
#     排查用。会打印 coexist/claim/paste 的每一个决策。
